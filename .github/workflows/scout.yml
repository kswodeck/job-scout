name: Job Scout

on:
  schedule:
    - cron: "0 9 */2 * *" # Every other day (odd days of the month) at 4:00am Central during CDT (3:00am during CST); GitHub cron often fires 1-2h late on quiet repos. Note: */2 fires on days 1,3,...,31, so 31-day months end with back-to-back runs on the 31st and 1st.
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days of postings to scan (blank = config default)"
        required: false

concurrency:
  group: job-scout
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Hoisted to job level because the `secrets` context is NOT available in
    # step-level `if:` conditions — `env` is, so the private-state steps gate on
    # env.STATE_REPO instead.
    env:
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_TOKEN: ${{ secrets.STATE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Only needed when materials.enabled — installs the isolated docx builder.
      # Harmless (fast) when the feature is off.
      - name: Install materials builder deps
        run: npm ci --prefix materials

      # This repo is public, so the files describing Kris's actual search
      # (applied.json, matches.json, matches.md) live in a private state repo
      # instead. Pull them in before the run; push them back after. Without
      # STATE_REPO/STATE_TOKEN the scout still runs — it just starts with no
      # match history, so duplicate suppression is off for that run.
      - name: Pull private state
        if: ${{ env.STATE_REPO != '' && env.STATE_TOKEN != '' }}
        run: |
          git clone --depth 1 "https://x-access-token:${STATE_TOKEN}@github.com/${STATE_REPO}.git" /tmp/state
          for f in applied.json matches.json matches.md; do
            if [ -f "/tmp/state/$f" ]; then cp "/tmp/state/$f" "data/$f"; echo "restored $f"; fi
          done

      - name: Run scout
        env:
          # Subscription mode (default): set CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
          # API mode (config llm.transport="api"): set ANTHROPIC_API_KEY instead.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Autonomous draft materials -> Google Drive (only when materials.enabled).
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Kept out of the repo because it is public: Google resource IDs act as
          # capabilities for anything shared "anyone with the link", and resume
          # contact details get harvested by scrapers. Unset = those stages skip
          # (tracker/materials) or omit the line (contact).
          TRACKER_SPREADSHEET_ID: ${{ secrets.TRACKER_SPREADSHEET_ID }}
          MATERIALS_DRIVE_FOLDER_ID: ${{ secrets.MATERIALS_DRIVE_FOLDER_ID }}
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}
          RESUME_EMAIL: ${{ secrets.RESUME_EMAIL }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: node src/scout.js

      # Only the non-sensitive state lands here: seen.json, the ATS watchlist,
      # the HN cursor, config. The three private files are gitignored.
      - name: Commit public state
        run: |
          git config user.name "job-scout"
          git config user.email "job-scout@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "scout state: $(date -u +%F)"
          git push

      - name: Push private state
        if: ${{ env.STATE_REPO != '' && env.STATE_TOKEN != '' }}
        run: |
          for f in applied.json matches.json matches.md; do
            if [ -f "data/$f" ]; then cp "data/$f" "/tmp/state/$f"; fi
          done
          cd /tmp/state
          git config user.name "job-scout"
          git config user.email "job-scout@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "scout state: $(date -u +%F)"
          git push "https://x-access-token:${STATE_TOKEN}@github.com/${STATE_REPO}.git" HEAD:HEAD

      # The digest names the companies he is targeting and carries the rubric's
      # private read on each, so it goes to the private state repo — never to
      # this public one. No STATE_REPO configured = no issue anywhere, which is
      # the fail-safe direction: a missed digest beats a public one.
      - name: Open digest issue (private repo)
        if: ${{ hashFiles('digest.md') != '' && env.STATE_REPO != '' && env.STATE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: gh issue create --repo "$STATE_REPO" --title "$(cat digest_title.txt)" --body-file digest.md

      - name: Warn if digest had nowhere private to go
        if: ${{ hashFiles('digest.md') != '' && (env.STATE_REPO == '' || env.STATE_TOKEN == '') }}
        run: |
          echo "::warning::Digest built but STATE_REPO/STATE_TOKEN are unset, so no issue was opened."
          echo "::warning::This repo is public - posting the digest here would publish the job search. See README 'Private state repo'."
